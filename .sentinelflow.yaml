version: "1.0"

scanners:
  # Global path skips (all scanners / shared engine walk).
  # Secrets-only noise belongs under scanners.secrets.allowlist.
  exclude:
    - "test/**"
    - "examples/demo-project/**"
    - "**/testdata/**"

  secrets:
    enabled: true
    allowlist:
      - "**/*_test.go"
      - "**/*_bench_test.go"
      # Scanner implementations contain intentional pattern examples
      - "internal/scanner/sast/scanner.go"
      - "internal/scanner/secrets/scanner.go"
      - "internal/scanner/secrets/patterns_test.go"
      - "internal/scanner/policy/engine.go"
      - "internal/scanner/container/scanner.go"
      - "internal/scanner/dependencies/scanner.go"
      - "internal/scanner/iac/dockerfile.go"

  iac:
    enabled: true

  dependencies:
    enabled: true
    ignore_cves:
      # Indirect via OPA; openpgp subpackage is unmaintained — tracked upstream
      - GO-2026-5932
      # Indirect via OPA/otel; bump when OPA picks up a fixed otel release
      - GO-2026-5158

  sast:
    enabled: true

  license:
    enabled: true

policies:
  enabled: true

fail_on:
  severity: high
  secrets: true
  policy_violations: true
