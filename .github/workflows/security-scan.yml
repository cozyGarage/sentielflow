name: SentinelFlow Security Scan

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run SentinelFlow scan
        uses: ./.github/actions/sentinelflow
        with:
          scan-all: 'true'
          fail-on: high
          format: sarif
          output: report.sarif

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: report.sarif
          category: sentinelflow

      - name: Generate Markdown report
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/sentinelflow
        continue-on-error: true
        with:
          scan-all: 'true'
          fail-on: low
          format: markdown
          output: report.md

      - name: Comment on pull request
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('report.md')) {
              core.info('No report.md found, skipping PR comment');
              return;
            }

            const report = fs.readFileSync('report.md', 'utf8');
            const marker = 'SentinelFlow Security Scan Report';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: report,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report,
              });
            }

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build SentinelFlow
        run: go build -o sentinelflow ./cmd/sentinelflow

      - name: Generate SBOM
        run: ./sentinelflow sbom -o sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 30

  policy-check:
    name: Policy Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build SentinelFlow
        run: go build -o sentinelflow ./cmd/sentinelflow

      - name: Validate built-in policies
        run: |
          for policy in policies/*.rego; do
            echo "Validating $policy"
            ./sentinelflow policy validate "$policy"
          done

      - name: Validate custom policies
        if: hashFiles('.sentinelflow/policies/*.rego') != ''
        run: |
          for policy in .sentinelflow/policies/*.rego; do
            echo "Validating $policy"
            ./sentinelflow policy validate "$policy"
          done
