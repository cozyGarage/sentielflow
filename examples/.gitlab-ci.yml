stages:
  - security

sentinelflow:
  stage: security
  image: golang:1.22
  before_script:
    - go install github.com/cozygarage/sentinelflow/cmd/sentinelflow@latest
  script:
    - sentinelflow scan --all --format sarif -o gl-sast-report.sarif
    - sentinelflow scan --all --format json -o sentinelflow-results.json
  artifacts:
    reports:
      sast: gl-sast-report.sarif
    paths:
      - sentinelflow-results.json
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

# Alternative: using Docker image
sentinelflow-docker:
  stage: security
  image: sentinelflow/scanner:latest
  script:
    - sentinelflow scan --all --format sarif -o gl-sast-report.sarif
  artifacts:
    reports:
      sast: gl-sast-report.sarif
  only:
    - merge_requests
    - main
